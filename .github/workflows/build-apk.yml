name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:          # زر تشغيل يدوي من الموقع

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت المكتبات
        working-directory: apk
        run: |
          npm install --no-audit --no-fund

      - name: إنشاء مشروع أندرويد
        working-directory: apk
        run: |
          npx cap add android
          npx cap sync android

      - name: السماح بالاتصال بالشبكة المحلية
        working-directory: apk
        run: python3 fix_manifest.py

      - name: بناء الـAPK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: رفع الملف الناتج
        uses: actions/upload-artifact@v4
        with:
          name: RouterEasy-APK
          path: apk/android/app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: نشر إصدار جاهز للتحميل
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Router Easy v${{ github.run_number }}
          body: |
            ## 📱 تطبيق راوتر إيزي

            حمّل الملف `app-debug.apk` وثبّته على هاتفك.

            **لا يحتاج بايثون ولا أي برنامج آخر.**

            عند التثبيت قد يقول أندرويد «مصدر غير معروف» — اضغط «السماح».
          files: apk/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
